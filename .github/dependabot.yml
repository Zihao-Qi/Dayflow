version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Security updates arrive regardless of this schedule; the interval only
    # governs routine version maintenance.
    open-pull-requests-limit: 5
    # CLI, generated client and SQLite adapter are one compatible upgrade.
    groups:
      prisma:
        patterns:
          - prisma
          - "@prisma/client"
          - "@prisma/adapter-better-sqlite3"
