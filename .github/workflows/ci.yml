name: CI

on:
  # Every pull request, whatever it targets. Filtering on `main` meant a
  # stacked pull request - one opened against another branch so the two can be
  # reviewed separately - ran no checks at all and still reported a clean,
  # mergeable state.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TZ: America/Chicago
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  reliability:
    name: Reliability gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends sqlite3

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run reliability gates
        run: npm run check
        env:
          DATABASE_URL: file:${{ runner.temp }}/dayflow-ci.db
          DAYFLOW_BACKUP_DIRECTORY: ${{ runner.temp }}/dayflow-ci-backups

      - name: Upload browser failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
